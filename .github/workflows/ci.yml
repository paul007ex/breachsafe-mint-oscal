name: CI

# Automatic triggers are disabled: GitHub Actions execution is blocked on this repo by
# billing (#46), so push/pull_request runs only produce noise (failed/queued jobs with no
# steps). The pipeline is kept intact and runnable on demand via the Actions tab; re-enable
# the push/pull_request triggers below in one edit once billing is restored.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        # Tolerate pytest's "no tests collected" exit code 5 until the suite lands
        # (#6/#41). TODO(#6): drop the exit-5 tolerance and add a minimum test-count /
        # coverage gate here (e.g. `coverage run -m pytest && coverage report
        # --fail-under=<N>`) once the suite is stable — #17 tracks the gate.
        run: pytest -q || [ "$?" -eq 5 ]

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # License-free secret scan: gitleaks is MIT and the OSS CLI needs no key. We
      # avoid gitleaks-action (org-license gate) AND the Docker image (ghcr pull is
      # flaky/rate-limited on hosted runners); instead fetch the pinned release
      # binary and run it against the working tree. `--no-git` scans the checked-out
      # tree deterministically. Any finding makes gitleaks exit non-zero.
      - name: gitleaks (secret scan)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source=. --no-git --redact --no-banner

  packaging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Leak-guard: reject any build artifact that ships internal tooling. We
      # inspect the archive namelists (wheel = zip, sdist = tar.gz) instead of
      # trusting the source tree, so a stray path packaged by mistake is caught.
      - name: Leak-guard (no internal tooling in artifacts)
        run: python scripts/leak_guard.py dist

      - name: Clean-install the built wheel + console smoke test
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install "$wheel"
          # Real console entrypoint from a clean env; stdout must be valid JSON.
          /tmp/smoke-venv/bin/mint-oscal poam generate --from cbom examples/example.cbom.json \
            | /tmp/smoke-venv/bin/python -m json.tool > /dev/null
          echo "console smoke OK: valid OSCAL JSON on stdout"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: pip-audit (dependency vulnerabilities)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install .
          pip-audit --desc

  conformance:
    # NIST oscal-cli conformance gate (#17): prove every POA&M we mint is schema-
    # /constraint-valid against the upstream OSCAL reference validator, not just our
    # in-tree checks. This job does NOT depend on the pytest suite.
    #
    # TODO(#6/#41): a golden-output regression job and a minimum test-count / coverage
    # gate are the other #17 CI items; they legitimately depend on the test suite
    # (#6) and stable fixtures (#41), so they are deferred there and NOT implemented
    # here.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # NIST oscal-cli, pinned by digest. Digest resolved from
      # ghcr.io/metaschema-framework/oscal-cli:latest on 2026-07-28. Re-resolve with
      # `docker inspect --format='{{index .RepoDigests 0}}' <image>` when bumping.
      OSCAL_CLI: ghcr.io/metaschema-framework/oscal-cli@sha256:755aa57e68159bc0d73db815234f7e7ef46016b6ceeb8963467d02ec9626bd65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Generate POA&M from example CBOM
        run: mint-oscal poam generate --from cbom examples/example.cbom.json > poam.json

      # oscal-cli exits 0 even when a document is INVALID, so we must not trust $?.
      # Instead we assert on the reference validator's own verdict strings: a valid
      # doc prints "... is valid.", an invalid one prints "... is invalid." (note
      # "is valid" is not a substring of "is invalid", so the two are unambiguous).
      - name: Validate generated POA&M (positive control)
        run: |
          set -euo pipefail
          out="$(docker run --rm -v "$PWD:/w" "$OSCAL_CLI" poam validate /w/poam.json 2>&1)"
          echo "$out"
          if echo "$out" | grep -q "is invalid" || ! echo "$out" | grep -q "is valid"; then
            echo "::error::oscal-cli did not report the minted POA&M as valid"
            exit 1
          fi
          echo "PASS: minted POA&M is OSCAL-valid"

      # Negative control: a deliberately-broken POA&M (top-level required `uuid`
      # removed) MUST be rejected. This proves the gate actually catches invalidity
      # rather than rubber-stamping every input.
      - name: Reject broken POA&M (negative control)
        run: |
          set -euo pipefail
          out="$(docker run --rm -v "$PWD:/w" "$OSCAL_CLI" poam validate /w/examples/broken.poam.json 2>&1)"
          echo "$out"
          if ! echo "$out" | grep -q "is invalid"; then
            echo "::error::oscal-cli failed to reject a known-invalid POA&M — the conformance gate is not working"
            exit 1
          fi
          echo "PASS: broken POA&M correctly rejected by oscal-cli"

  regression:
    # Black-box CLI regression harness (scripts/regression.sh): drives the real console
    # entry point across every parameter, exit path, and fixed-bug guard (#62/#64/#67/#68 +
    # never-raises + determinism) against real and adversarial inputs. No pytest, no mocks;
    # complements the pytest suite (#6/#41) rather than replacing it. The harness's optional
    # oscal-cli Layer-1 check is skipped here (the `conformance` job owns that).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: CLI regression harness
        run: bash scripts/regression.sh
