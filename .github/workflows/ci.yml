name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest
        # TODO(#6): once the suite lands (#6/#41), add a minimum test-count /
        # coverage gate here (e.g. `coverage run -m pytest && coverage report
        # --fail-under=<N>`). Deferred until the suite is stable.

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # License-free secret scan: gitleaks is MIT and the OSS CLI needs no key.
      # We deliberately avoid gitleaks-action (org-license gate) and instead run
      # the pinned Docker image (pinned by digest for v8.21.2). `--no-git` scans
      # the checked-out working tree directly, so the result is deterministic and
      # independent of the shallow-clone depth actions/checkout uses. Any finding
      # makes gitleaks exit non-zero and fails the job.
      - name: gitleaks (secret scan)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source=/repo --no-git --redact --no-banner

  packaging:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Leak-guard: reject any build artifact that ships internal tooling. We
      # inspect the archive namelists (wheel = zip, sdist = tar.gz) instead of
      # trusting the source tree, so a stray path packaged by mistake is caught.
      - name: Leak-guard (no internal tooling in artifacts)
        run: python scripts/leak_guard.py dist

      - name: Clean-install the built wheel + console smoke test
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --upgrade pip
          /tmp/smoke-venv/bin/pip install "$wheel"
          # Real console entrypoint from a clean env; stdout must be valid JSON.
          /tmp/smoke-venv/bin/mint-oscal poam generate --from cbom examples/example.cbom.json \
            | /tmp/smoke-venv/bin/python -m json.tool > /dev/null
          echo "console smoke OK: valid OSCAL JSON on stdout"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: pip-audit (dependency vulnerabilities)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install .
          pip-audit --desc
