name: OSCAL Conformance

# NIST OSCAL conformance gate (#71 / #17): prove every POA&M and Profile mint-oscal emits is valid
# against the upstream reference validator (oscal-cli 3.2.0), not just our in-tree Layer-2
# checks. This runs the EXACT same script a developer runs locally
# (`scripts/oscal-conformance.sh`) — CI and laptop share one gate, no drift.
#
# READY-BUT-GATED (#46): GitHub Actions cannot execute jobs on this private repo — every
# run fails with zero failed steps / BlobNotFound because the runner never starts (Actions
# minutes at $0 / billing). So automatic push/pull_request triggers would only produce red
# noise. The trigger is therefore `workflow_dispatch` only; flip on push/pull_request below
# in one edit once #46 is resolved (raise the Actions spending limit, make the repo public,
# or add a self-hosted runner). The gate itself is proven locally today.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # oscal-cli is pure Java and needs a JRE 17+. Provide one here; the gate script
      # auto-detects JAVA_HOME (else downloads oscal-cli from Maven Central itself).
      - name: Set up JRE 17 (for oscal-cli)
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mint-oscal
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Profile conformance uses the same Compliance Trestle major version as the
          # local pressure-test fixture and ADR-0010. Keep this explicit until the Profile
          # compiler promotes Trestle to a runtime dependency.
          pip install "compliance-trestle==5.0.0"

      # Runs the identical local gate: mint a POA&M from the fixture CBOM, validate the
      # Profile fixture with Trestle, resolve it, then fetch/detect
      # oscal-cli 3.2.0 (Maven coordinate dev.metaschema.oscal:oscal-cli-enhanced:3.2.0),
      # assert the minted doc is VALID (positive control) and that a doc with a required
      # field removed is REJECTED (negative control). Exits non-zero on any failure.
      - name: Run NIST OSCAL conformance gate
        run: bash scripts/oscal-conformance.sh
