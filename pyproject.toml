[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breachsafe-mint-oscal"
version = "0.2.2"
description = "Mint NIST OSCAL documents (POA&M, and more) from a source-neutral intermediate representation."
readme = "README.md"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "BreachSAFE" }]
keywords = ["oscal", "nist", "compliance", "poam", "sp800-53", "pqc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "cyclonedx-python-lib>=11,<12",
  "jsonschema>=4,<5",
  "PyYAML>=6",
  "structlog>=24",
]

[project.urls]
Homepage = "https://github.com/breachsafe/breachsafe-mint-oscal"
Changelog = "https://github.com/breachsafe/breachsafe-mint-oscal/blob/main/CHANGELOG.md"
Issues = "https://github.com/breachsafe/breachsafe-mint-oscal/issues"

[project.scripts]
mint-oscal = "mint_oscal.cli:main"

[project.entry-points."mint_oscal.adapters"]
qureddy = "mint_oscal.adapters.qureddy:from_scan_v1"
cbom = "mint_oscal.adapters.cbom:from_cbom"

# Extensions are orthogonal to source adapters (ADR-0008): opt-in enrichers that refine
# the neutral IR from producer-declared facts. breachsafe is the bundled cross-check;
# it is NOT a --from source.
[project.entry-points."mint_oscal.extensions"]
breachsafe = "mint_oscal.extensions.breachsafe:enrich"

[project.optional-dependencies]
# XML/YAML output is produced by shelling out to an external `oscal-cli` (ADR-0005),
# not by an in-tree serializer, so this group is intentionally empty: it documents
# the requirement and reserves the extra name.
xml = []
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-randomly",
  "types-jsonschema",
  "types-PyYAML",
  "coverage[toml]",
  "allure-pytest>=2.15,<3",
  "bandit>=1.8,<2",
  "deptry>=0.23,<1",
  "diff-cover>=9,<10",
  "import-linter>=2,<3",
  "interrogate>=1.7,<2",
  "pip-audit>=2.9,<3",
  "pylint>=3.3,<4",
  "pytest-cov>=6,<7",
  "refurb>=2,<3",
  "vulture>=2.14,<3",
  "xenon>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mint_oscal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Aligned with (and a superset of) BreachSAFE QuReddy's ruleset: same strict base plus
# ANN (annotations) and T20 (no stray print) which this repo additionally enforces. The
# QuReddy extras — N/TCH/PL/PT/RET/ARG/DTZ/ERA/INP/BLE/SLF — make the anti-pattern
# discipline lint-enforced rather than review-enforced (notably BLE: an `except Exception`
# must be deliberate and carry a justified noqa).
select = [
  "E", "W", "F", "I", "B", "C4", "T20", "SIM", "S", "UP", "PTH", "RUF", "ANN", "D",
  "N", "TCH", "PL", "PT", "RET", "ARG", "DTZ", "ERA", "INP", "BLE", "SLF",
]
# D203/D211 and D212/D213 are mutually exclusive one-blank-line/summary-line
# conventions; pick one of each.
# TC001/TC002/TC003 (move type-only imports into an `if TYPE_CHECKING:` block) are an
# import-time micro-optimization that adds boilerplate for no correctness benefit on a small
# CLI; `from __future__ import annotations` already makes the annotations lazy. QuReddy ignores
# TC002/TC003 for the same reason. The substantive TCH checks stay active.
ignore = ["D203", "D213", "TC001", "TC002", "TC003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# Function-size ceiling: PLR0915 counts statements as a proxy for non-comment lines.
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts (S101), magic numbers, unused fixture args, and need no docstrings;
# they are owned by the tester.
"tests/**" = ["S", "ANN", "D", "PLR2004", "ARG"]
# Operational scripts are standalone CLIs (print is fine; not an importable package).
"scripts/**" = ["T20", "INP001"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p randomly -ra --alluredir=.allure-results"

[tool.coverage.run]
source = ["mint_oscal"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.bandit]
# Python SAST. Scans src only; the shipped code has zero findings today. tests/ (when it
# exists) is excluded since asserts there are expected. Run: `bandit -c pyproject.toml -r src`.
exclude_dirs = ["tests"]

[tool.importlinter]
root_package = "mint_oscal"
include_external = false

[[tool.importlinter.contracts]]
name = "CLI boundary does not leak into the domain core"
type = "forbidden"
source_modules = ["mint_oscal.ir", "mint_oscal.adapters", "mint_oscal.emitters", "mint_oscal.policy"]
forbidden_modules = ["mint_oscal.cli"]
