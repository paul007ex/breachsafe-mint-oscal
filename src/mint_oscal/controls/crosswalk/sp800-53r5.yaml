---
version: sp800-53r5
status: draft-unreviewed
readiness:
  quantum_vulnerable:
    primary: [SC-13]
    supporting: [SC-12]
    rationale: >
      Cryptographic protection (SC-13) is the anchor; classical key establishment
      implicates key management (SC-12). Harvest-now-decrypt-later exposure.
  classically_weak:
    primary: [SC-13]
    supporting: [SC-12]
    rationale: >
      A weak or deprecated primitive is a cryptographic-protection defect (SC-13);
      key establishment quality (SC-12) supports.
  transitional_hybrid:
    primary: [SC-13]
    supporting: []
    rationale: >
      PQ-hybrid negotiated; cryptographic protection (SC-13) remains the frame for
      residual classical elements.
